# Hangzhou-only compose: no build: keys. Load images first, then:
#   docker compose -f deploy/docker-compose.hz.yml up -d --no-build --force-recreate

services:
  game:
    image: bomberman-game:latest
    container_name: bomberman-game
    restart: unless-stopped
    expose:
      - "9080"
    networks:
      - bomberman

  web:
    image: bomberman-web:latest
    container_name: bomberman-web
    restart: unless-stopped
    depends_on:
      - game
    ports:
      - "127.0.0.1:${BOMBERMAN_HTTP_PORT:-18080}:80"
    networks:
      - bomberman

networks:
  bomberman:
    driver: bridge
