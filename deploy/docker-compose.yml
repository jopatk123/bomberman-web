# Run from project root:
#   docker compose -f deploy/docker-compose.yml up -d --build   # Singapore / build host
#   docker compose -f deploy/docker-compose.yml up -d --no-build # Hangzhou after docker load
#
# Hangzhou outer proxy (TLS):
#   bomberman.jopatk.top:443 → http://127.0.0.1:18080
#   Clients: wss://bomberman.jopatk.top/ws

services:
  game:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: game
    image: bomberman-game:latest
    container_name: bomberman-game
    restart: unless-stopped
    expose:
      - "9080"
    networks:
      - bomberman

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
    image: bomberman-web:latest
    container_name: bomberman-web
    restart: unless-stopped
    depends_on:
      - game
    ports:
      # Loopback only — outer nginx terminates TLS
      - "127.0.0.1:${BOMBERMAN_HTTP_PORT:-18080}:80"
    networks:
      - bomberman

networks:
  bomberman:
    driver: bridge
