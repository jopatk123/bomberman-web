# Run from project root OR from deploy/ with COMPOSE_FILE.
# Recommended (from project root):
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Hangzhou outer proxy example (TLS at edge):
#   bomberman.jopatk.top:443 → http://127.0.0.1:18080
#   Clients join via wss://bomberman.jopatk.top/ws (built into web lobby default)

services:
  game:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: game
    image: bomberman-game:latest
    container_name: bomberman-game
    restart: unless-stopped
    expose:
      - "9080"
    # Optional direct WS debug (leave commented in production; use /ws via nginx)
    # ports:
    #   - "9080:9080"
    networks:
      - bomberman

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
    image: bomberman-web:latest
    container_name: bomberman-web
    restart: unless-stopped
    depends_on:
      - game
    ports:
      - "${BOMBERMAN_HTTP_PORT:-18080}:80"
    networks:
      - bomberman

networks:
  bomberman:
    driver: bridge
