# Internal container nginx: static Godot Web + WebSocket reverse proxy to game:9080
# TLS for bomberman.jopatk.top should terminate on Hangzhou's outer reverse proxy
# (Caddy/Nginx/etc.) and forward HTTP to this service's port 80.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream bomberman_game {
    server game:9080;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Godot WebAssembly
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
        application/octet-stream pck;
    }
    default_type application/octet-stream;

    # Cache hashed/static assets lightly; index.html always revalidate
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # Browser clients connect to wss://bomberman.jopatk.top/ws
    # Outer TLS proxy → this /ws → game WebSocket on 9080
    location /ws {
        proxy_pass http://bomberman_game;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }
}
